[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinta-django-audit-logs"
version = "0.1.1"
description = "An append-only audit log for Django, with swappable scope and identity models, a portable query object and pluggable storage backends."
readme = "README.md"
# uuid7 landed in the standard library in 3.14, and the record identity
# column depends on it: a time-ordered uuid is what keeps the unique index on
# an append-only table taking its inserts at the right edge rather than
# scattered across the tree.
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
maintainers = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
keywords = [
    "django",
    "audit",
    "audit-log",
    "audit-trail",
    "compliance",
    "multitenancy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = ["django>=5.2"]

[project.optional-dependencies]
# The default record dispatcher is a Celery task. A project queueing records some
# other way -- or writing them inline -- never imports vinta_audit_logs.tasks and
# does not need this.
celery = ["celery>=5.3"]

[project.urls]
Homepage = "https://github.com/vintasoftware/vinta-django-audit-logs"
Documentation = "https://github.com/vintasoftware/vinta-django-audit-logs#readme"
Repository = "https://github.com/vintasoftware/vinta-django-audit-logs"
Issues = "https://github.com/vintasoftware/vinta-django-audit-logs/issues"
Changelog = "https://github.com/vintasoftware/vinta-django-audit-logs/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "celery>=5.3",
    "django-stubs[compatible-mypy]>=5.2",
    "mypy>=1.15",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.10",
    "ruff>=0.9",
    "tox>=4.24",
    "tox-uv>=1.25",
]

[tool.hatch.build.targets.wheel]
packages = ["vinta_audit_logs"]

[tool.hatch.build.targets.sdist]
include = [
    "/vinta_audit_logs",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/tox.ini",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 99
target-version = "py314"
src = ["vinta_audit_logs", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "I",    # isort
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "RUF012", # mutable class attrs need ClassVar - noisy with Django Meta
    "N818",   # exceptions read as conditions here, the way Django's own do
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DJ008", "PT018", "RUF043", "S101", "DTZ001"]
"vinta_audit_logs/migrations/*" = ["E501"]
# `types` is only ambiguous under implicit relative imports, which Python has not
# had for a long time, and it is the right name for a module of DTOs.
"vinta_audit_logs/types.py" = ["A005"]
# The write path must never let an audit record break the action it describes,
# which means catching everything at a handful of deliberate points.
"vinta_audit_logs/dispatch.py" = ["BLE001"]
"vinta_audit_logs/services.py" = ["BLE001"]
"vinta_audit_logs/tasks.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["vinta_audit_logs"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
files = ["vinta_audit_logs", "tests"]
plugins = ["mypy_django_plugin.main"]
warn_unreachable = true
show_error_codes = true
exclude = ['/migrations/']
check_untyped_defs = true

[[tool.mypy.overrides]]
# The repository maps portable DTOs onto whichever concrete models a project
# swapped in, so the attributes it reads exist only on the swapped model.
module = ["vinta_audit_logs.repositories", "vinta_audit_logs.factories"]
disable_error_code = ["attr-defined", "type-arg", "no-any-return"]

[[tool.mypy.overrides]]
# ModelAdmin is not subscriptable at runtime.
module = ["vinta_audit_logs.admin"]
disable_error_code = ["type-arg", "attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_unreachable = false
warn_return_any = false
disable_error_code = ["union-attr", "attr-defined", "var-annotated"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
# tests/swapped runs under its own settings module: both models are swapped
# there, and Meta.swappable cannot be moved once the models are imported.
addopts = "--strict-markers --strict-config -ra --ignore=tests/swapped"
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source_pkgs = ["vinta_audit_logs"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.paths]
source = ["vinta_audit_logs", "*/site-packages/vinta_audit_logs"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
